services:
  - type: web
    name: job-portal-fastapi
    env: python
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 8000
      - key: FIREBASE_PROJECT_ID
        value: job-portal-ai-818f8
      - key: CORS_ORIGINS
        value: '["https://job-portal-ai-one.vercel.app"]'
      - key: DATABASE_URL
        fromDatabase:
          name: openroles-db
          property: connectionString

databases:
  - name: openroles-db
    databaseName: openroles
    user: postgres
    plan: free
